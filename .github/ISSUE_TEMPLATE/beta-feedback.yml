name: Spectrune feedback
description: Share a bug, usability problem, suggestion, or other Spectrune experience.
title: "[Feedback]: "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Your feedback will be public. Don't include personal or sensitive information.
        Never include email addresses, license keys, passwords, tokens, private file paths, or private project details.
        This is the optional manual GitHub form. The planned in-app submission workflow still needs implementation.
  - type: dropdown
    id: feedback_type
    attributes:
      label: Feedback type
      options:
        - Bug or unexpected behavior
        - Usability or workflow problem
        - Feature suggestion
        - Performance or reliability
        - General feedback
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Feedback
      description: Describe your experience, problem, or suggestion in at least 50 characters. Do not include private data.
      placeholder: Tell us what happened or what could be improved.
      render: text
    validations:
      required: true
      min_length: 50
  - type: input
    id: spectrune_version
    attributes:
      label: Spectrune version or build
      description: Enter the visible app version when known. Do not enter a license key.
    validations:
      required: false
  - type: input
    id: public_feedback_user_id
    attributes:
      label: Public feedback-user ID (optional)
      description: Only enter an opaque public feedback ID already provided by Spectrune. Otherwise leave blank. Never enter an email, account ID, or license key.
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps or context (optional)
      description: Describe the workflow or reproduction steps without private paths or project details.
      render: text
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected result (optional)
      description: What did you expect to happen?
      render: text
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform (optional)
      options:
        - Windows
        - macOS
        - Other or not applicable
    validations:
      required: false
  - type: checkboxes
    id: public_feedback_check
    attributes:
      label: Public feedback acknowledgement
      options:
        - label: I understand this report is public and have left out personal information, private project data, license keys, passwords, and tokens.
          required: true
